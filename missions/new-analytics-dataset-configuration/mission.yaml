name: New Analytics Dataset Configuration
description: >-
  Select or create a BigQuery dataset, grant service-account access, bind a
  hosting-repo queries/results/data-schema workspace, and persist dataset schema
  for query agents — or fix an existing dataset binding step by step.
commands:
  - phrase: configure new analytics dataset
    description: Configure a BigQuery dataset and its local analytics workspace.
  - phrase: fix the existing dataset configuration
    description: >-
      Pick an existing dataset binding and walk configuration steps one at a
      time, fixing only the steps that need it.
